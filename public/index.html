<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALEX | Alexandria Index</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">ALEX</div>
          <div>
            <p class="eyebrow">The Alexandria Index</p>
            <h1>Robotics Knowledge Vault</h1>
          </div>
        </div>
        <button id="toggleFormBtn" class="primary-btn">Add Resource</button>
      </header>

      <p class="subtitle">A living archive for the robotics team — where designs, test footage, and field notes become collective memory.</p>

      <main class="layout">
        <section id="uploadPanel" class="panel upload-panel hidden">
          <h2>Upload a new resource</h2>
          <form id="uploadForm" enctype="multipart/form-data">
            <div class="grid">
              <label>
                <span>Title</span>
                <input type="text" name="title" placeholder="e.g. Autonomous Drive Review" required />
              </label>

              <label>
                <span>Category</span>
                <select name="category" required>
                  <option value="">Select a category</option>
                  <option value="Mechanical">Mechanical</option>
                  <option value="Electrical">Electrical</option>
                  <option value="Software">Software</option>
                  <option value="Testing">Testing</option>
                  <option value="Competition">Competition</option>
                  <option value="Operations">Operations</option>
                </select>
              </label>

              <label>
                <span>Uploader</span>
                <input type="text" name="uploader" placeholder="Team member name" />
              </label>

              <label class="file-field">
                <span>File</span>
                <input type="file" name="file" required />
              </label>
            </div>

            <label>
              <span>Description</span>
              <textarea name="description" placeholder="Add context, notes, or a summary of the file..." rows="4"></textarea>
            </label>

            <button type="submit" class="primary-btn">Save to library</button>
          </form>
        </section>

        <section class="panel library-panel">
          <div class="library-header">
            <h2>Knowledge base</h2>
            <input id="searchInput" type="search" placeholder="Search title, category, or uploader" />
          </div>
          <div id="recordsContainer" class="records-grid"></div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
